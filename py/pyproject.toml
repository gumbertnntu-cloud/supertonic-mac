[project]
name = "supertonic-mac-py"
version = "0.1.0"
description = "Python TTS backends for Supertonic Mac app (Supertonic ONNX, Silero v4 RU, F5-TTS cloning)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "onnxruntime==1.23.1",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "PyYAML>=6.0",
    "omegaconf>=2.3.0",
    "torch>=2.4",
    "torchaudio>=2.4",
    "f5-tts",
    "f5-tts-mlx",
    "gigaam-mlx",
    "coqui-tts",
]

[tool.uv.sources]
# CPU-only torch wheels (no CUDA) for smaller install on Apple Silicon
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
gigaam-mlx = { git = "https://github.com/aystream/gigaam-mlx.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
